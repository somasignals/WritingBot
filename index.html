<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>#WorthLivingFor CMS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f5f5f5; font-family: 'Inter', system-ui, sans-serif; }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }
  textarea, input { font-family: 'Inter', system-ui, sans-serif; }
  .spin { animation: spin 1s linear infinite; display: inline-block; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const SUPABASE_URL = "https://jnhsdzmlwijpozurdpok.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpuaHNkem1sd2lqcG96dXJkcG9rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5ODg0MDcsImV4cCI6MjA5NjU2NDQwN30.BP8yn6j6pu1iEgXlBcqJ1NxLxBiFJA1GZouBaFhoBy4";

function getGeminiKey() { return localStorage.getItem("wlf_gemini_key") || ""; }
function setGeminiKey(k) { localStorage.setItem("wlf_gemini_key", k); }

const CATEGORIES = [
  { id: "food", label: "Food & Drink", emoji: "🍜" },
  { id: "film", label: "Film", emoji: "🎬" },
  { id: "music", label: "Music", emoji: "🎵" },
  { id: "gaming", label: "Gaming", emoji: "🎮" },
  { id: "books", label: "Books & Comics", emoji: "📚" },
  { id: "design", label: "Design", emoji: "✦" },
  { id: "travel", label: "Travel", emoji: "✈️" },
  { id: "goodvibes", label: "Daily Good", emoji: "🌱" },
];

const PLATFORMS = [
  { id: "instagram", label: "Instagram", color: "#E1306C" },
  { id: "threads", label: "Threads", color: "#333333" },
  { id: "tiktok", label: "TikTok", color: "#010101" },
  { id: "x", label: "X", color: "#1DA1F2" },
  { id: "facebook", label: "Facebook", color: "#1877F2" },
  { id: "gmaps", label: "Google Maps", color: "#34A853" },
];

async function sbFetch(path, options = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json",
      "Prefer": options.prefer || "return=representation",
      ...(options.headers || {}),
    },
  });
  if (!res.ok) throw new Error(await res.text());
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

const loadReviews = () => sbFetch("reviews?select=*&order=created_at.desc");

async function saveReview(review) {
  const body = {
    title: review.title,
    category: review.category,
    master_review: review.master_review,
    trend_links: review.trend_links,
    generated_content: review.generated_content,
    updated_at: new Date().toISOString(),
  };
  if (review.id) {
    return sbFetch(`reviews?id=eq.${review.id}`, { method: "PATCH", prefer: "return=representation", body: JSON.stringify(body) });
  } else {
    return sbFetch("reviews", { method: "POST", prefer: "return=representation", body: JSON.stringify({ ...body, created_at: new Date().toISOString() }) });
  }
}

const deleteReview = (id) => sbFetch(`reviews?id=eq.${id}`, { method: "DELETE", prefer: "return=minimal" });

async function generateContent(review, trendContext) {
  const categoryLabel = CATEGORIES.find(c => c.id === review.category)?.label || review.category;

  const prompt = `You are a social media strategist. Generate platform content for #WorthLivingFor. 
  MASTER REVIEW: Title: ${review.title}, Category: ${categoryLabel}, Content: ${review.master_review}. 
  TREND CONTEXT: ${trendContext || 'None'}.
  Respond only in valid JSON for instagram, threads, tiktok, x, facebook, gmaps.`;

  const apiKey = getGeminiKey();
  if (!apiKey) throw new Error("NO_API_KEY");

  const response = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`,
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }),
    }
  );

  const data = await response.json();
  if (data.error) throw new Error(data.error.message);
  const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
  const clean = raw.replace(/```json|```/g, "").trim();
  return JSON.parse(clean);
}

function CopyBtn({ text, label = "Copy" }) {
  const [copied, setCopied] = React.useState(false);
  return (
    <button
      onClick={() => { navigator.clipboard.writeText(text); setCopied(true); setTimeout(() => setCopied(false), 1800); }}
      style={{ fontSize: 11, padding: "3px 10px", borderRadius: 6, background: copied ? "#22c55e" : "#efefef", color: copied ? "#fff" : "#555", border: "none", cursor: "pointer", fontWeight: 700 }}
    >{copied ? "✓ Copied" : label}</button>
  );
}

function Block({ label, text, mono }) {
  if (!text) return null;
  return (
    <div style={{ marginBottom: 12 }}>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
        <span style={{ fontSize: 10, fontWeight: 800, color: "#aaa", textTransform: "uppercase" }}>{label}</span>
      </div>
      <div style={{ fontSize: 13, color: "#222", lineHeight: 1.6, whiteSpace: "pre-wrap", background: "#fafafa", border: "1px solid #efefef", borderRadius: 8, padding: "8px 12px", fontFamily: mono ? "monospace" : "inherit" }}>{text}</div>
    </div>
  );
}

function PlatformOutput({ platform, content }) {
  if (!content) return <div style={{ color: "#ccc", fontSize: 13, padding: 16 }}>No content generated.</div>;
  const p = PLATFORMS.find(x => x.id === platform);
  return (
    <div style={{ border: `2px solid ${p.color}28`, borderRadius: 12, overflow: "hidden", marginBottom: 4 }}>
      <div style={{ background: p.color, color: "#fff", padding: "9px 14px", fontWeight: 800, fontSize: 13 }}>{p.label}</div>
      <div style={{ padding: "14px" }}>
        {platform === 'instagram' ? <Block label="Caption" text={content.caption} /> : <Block label="Post Content" text={content.post || content.tweet || content.review || content.script} />}
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = React.useState("list");
  const [reviews, setReviews] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [generating, setGenerating] = React.useState(false);
  const [geminiKey, setGeminiKeyState] = React.useState(getGeminiKey());
  const [title, setTitle] = React.useState("");
  const [category, setCategory] = React.useState("food");
  const [masterReview, setMasterReview] = React.useState("");
  const [generatedContent, setGeneratedContent] = React.useState(null);
  const [activePlatform, setActivePlatform] = React.useState("instagram");

  React.useEffect(() => { fetchReviews(); }, []);

  async function fetchReviews() {
    setLoading(true);
    try { setReviews((await loadReviews()) || []); }
    catch (e) { console.error(e); }
    finally { setLoading(false); }
  }

  async function handleGenerate() {
    setGenerating(true);
    try {
      const content = await generateContent({ title, category, master_review: masterReview }, "");
      setGeneratedContent(content);
      await saveReview({ title, category, master_review: masterReview, generated_content: content });
      fetchReviews();
      setView("result");
    } catch (e) { alert(e.message); }
    finally { setGenerating(false); }
  }

  return (
    <div style={{ maxWidth: 680, margin: "0 auto", background: "#fff", minHeight: "100vh" }}>
      <div style={{ background: "#0f0f0f", color: "#fff", padding: "20px" }}>
        <div style={{ fontWeight: 900, display: "flex", justifyContent: "space-between" }}>
          <span>#WorthLivingFor CMS</span>
          <button onClick={() => { const k = prompt("Enter Gemini Key:"); setGeminiKey(k); setGeminiKeyState(k); }} style={{ background: geminiKey ? "#1a3a1a" : "#3a1a1a", border: "none", color: "#fff", fontSize: 10, padding: "4px 8px", borderRadius: 4 }}>
            {geminiKey ? "Key Set" : "Set API Key"}
          </button>
        </div>
        <div style={{ marginTop: 15, display: "flex", gap: 10 }}>
          <button onClick={() => setView("list")} style={{ background: view === "list" ? "#f5c542" : "#222", border: "none", padding: "5px 15px", borderRadius: 20, fontSize: 12, fontWeight: 700 }}>List</button>
          <button onClick={() => setView("editor")} style={{ background: view === "editor" ? "#f5c542" : "#222", border: "none", padding: "5px 15px", borderRadius: 20, fontSize: 12, fontWeight: 700 }}>+ New</button>
        </div>
      </div>

      <div style={{ padding: "20px" }}>
        {view === "list" && (
          loading ? <div>Loading...</div> : reviews.map(r => (
            <div key={r.id} style={{ border: "1px solid #eee", padding: 15, borderRadius: 10, marginBottom: 10 }}>
              <div style={{ fontWeight: 700 }}>{r.title}</div>
              <div style={{ fontSize: 12, color: "#888" }}>{r.category}</div>
            </div>
          ))
        )}

        {view === "editor" && (
          <div>
            <input placeholder="Title" value={title} onChange={e => setTitle(e.target.value)} style={{ width: "100%", padding: 12, marginBottom: 15, borderRadius: 8, border: "1px solid #ddd" }} />
            <textarea placeholder="Write your review..." value={masterReview} onChange={e => setMasterReview(e.target.value)} style={{ width: "100%", height: 200, padding: 12, marginBottom: 15, borderRadius: 8, border: "1px solid #ddd" }} />
            <button onClick={handleGenerate} disabled={generating} style={{ width: "100%", padding: 15, background: "#0f0f0f", color: "#f5c542", border: "none", borderRadius: 8, fontWeight: 800 }}>
              {generating ? "Generating..." : "⚡ Generate Content"}
            </button>
          </div>
        )}

        {view === "result" && generatedContent && (
          <div>
            <div style={{ display: "flex", gap: 5, flexWrap: "wrap", marginBottom: 15 }}>
              {PLATFORMS.map(p => (
                <button key={p.id} onClick={() => setActivePlatform(p.id)} style={{ padding: "5px 10px", borderRadius: 15, border: "none", fontSize: 11, background: activePlatform === p.id ? p.color : "#eee", color: activePlatform === p.id ? "#fff" : "#888" }}>{p.label}</button>
              ))}
            </div>
            <PlatformOutput platform={activePlatform} content={generatedContent[activePlatform]} />
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
