<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>#WorthLivingFor CMS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f5f5f5; font-family: 'Inter', system-ui, sans-serif; color: #111; }
  .spin { animation: spin 1s linear infinite; display: inline-block; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  textarea, input { font-family: 'Inter', sans-serif; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const SUPABASE_URL = "https://jnhsdzmlwijpozurdpok.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpuaHNkem1sd2lqcG96dXJkcG9rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5ODg0MDcsImV4cCI6MjA5NjU2NDQwN30.BP8yn6j6pu1iEgXlBcqJ1NxLxBiFJA1GZouBaFhoBy4";

function getGeminiKey() { return localStorage.getItem("wlf_gemini_key") || ""; }
function setGeminiKey(k) { localStorage.setItem("wlf_gemini_key", k); }

const CATEGORIES = [
  { id: "food", label: "Food & Drink", emoji: "🍜" },
  { id: "film", label: "Film", emoji: "🎬" },
  { id: "music", label: "Music", emoji: "🎵" },
  { id: "gaming", label: "Gaming", emoji: "🎮" },
  { id: "books", label: "Books & Comics", emoji: "📚" },
  { id: "design", label: "Design", emoji: "✦" },
  { id: "travel", label: "Travel", emoji: "✈️" },
  { id: "goodvibes", label: "Daily Good", emoji: "🌱" },
];

const PLATFORMS = [
  { id: "instagram", label: "Instagram", color: "#E1306C" },
  { id: "threads", label: "Threads", color: "#333333" },
  { id: "tiktok", label: "TikTok", color: "#010101" },
  { id: "x", label: "X", color: "#1DA1F2" },
  { id: "facebook", label: "Facebook", color: "#1877F2" },
  { id: "gmaps", label: "Google Maps", color: "#34A853" },
];

async function sbFetch(path, options = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json",
      "Prefer": options.prefer || "return=representation",
      ...(options.headers || {}),
    },
  });
  if (!res.ok) throw new Error(await res.text());
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

function CopyBtn({ text, label = "Copy" }) {
  const [copied, setCopied] = React.useState(false);
  return (
    <button
      onClick={() => { navigator.clipboard.writeText(text); setCopied(true); setTimeout(() => setCopied(false), 1800); }}
      style={{ fontSize: 11, padding: "4px 10px", borderRadius: 6, background: copied ? "#22c55e" : "#efefef", color: copied ? "#fff" : "#555", border: "none", cursor: "pointer", fontWeight: 700 }}
    >{copied ? "✓ Copied" : label}</button>
  );
}

function App() {
  const [view, setView] = React.useState("list");
  const [reviews, setReviews] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [generating, setGenerating] = React.useState(false);
  const [geminiKey, setGeminiKeyState] = React.useState(getGeminiKey());
  
  const [title, setTitle] = React.useState("");
  const [category, setCategory] = React.useState("food");
  const [masterReview, setMasterReview] = React.useState("");
  const [generatedContent, setGeneratedContent] = React.useState(null);
  const [activePlatform, setActivePlatform] = React.useState("instagram");

  React.useEffect(() => { loadAll(); }, []);

  async function loadAll() {
    setLoading(true);
    try { const data = await sbFetch("reviews?select=*&order=created_at.desc"); setReviews(data || []); }
    catch (e) { console.error(e); }
    finally { setLoading(false); }
  }

  async function handleGenerate() {
    if (!geminiKey) return alert("Please set your Gemini API Key first!");
    setGenerating(true);
    try {
      const prompt = `Generate social media content for: ${title} (${category}). Review: ${masterReview}. Respond only in JSON with keys: instagram, threads, tiktok, x, facebook, gmaps.`;
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiKey}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
      });
      const data = await res.json();
      const raw = data.candidates[0].content.parts[0].text.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(raw);
      setGeneratedContent(parsed);
      
      await sbFetch("reviews", { 
        method: "POST", 
        body: JSON.stringify({ title, category, master_review: masterReview, generated_content: parsed, created_at: new Date().toISOString() }) 
      });
      
      setView("result");
      loadAll();
    } catch (e) { alert("Error: " + e.message); }
    finally { setGenerating(false); }
  }

  return (
    <div style={{ maxWidth: 600, margin: "0 auto", background: "#fff", minHeight: "100vh" }}>
      <header style={{ background: "#0f0f0f", color: "#fff", padding: "20px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <h1 style={{ fontSize: 18, fontWeight: 900 }}>#WorthLivingFor CMS</h1>
          <button onClick={() => { const k = prompt("Paste Gemini API Key:"); if(k){setGeminiKey(k); setGeminiKeyState(k);} }} style={{ background: geminiKey ? "#1a3a1a" : "#3a1a1a", color: geminiKey ? "#4ade80" : "#f87171", border: "none", padding: "5px 10px", borderRadius: 20, fontSize: 10, fontWeight: 700, cursor: "pointer" }}>
            {geminiKey ? "✓ AI READY" : "⚠ SET API KEY"}
          </button>
        </div>
        <nav style={{ marginTop: 20, display: "flex", gap: 10 }}>
          <button onClick={() => setView("list")} style={{ background: view === "list" ? "#f5c542" : "#222", color: view === "list" ? "#000" : "#888", border: "none", padding: "8px 20px", borderRadius: 20, fontWeight: 700, cursor: "pointer" }}>Reviews</button>
          <button onClick={() => { setView("editor"); setGeneratedContent(null); setTitle(""); setMasterReview(""); }} style={{ background: view === "editor" ? "#f5c542" : "#222", color: view === "editor" ? "#000" : "#888", border: "none", padding: "8px 20px", borderRadius: 20, fontWeight: 700, cursor: "pointer" }}>+ New Review</button>
        </nav>
      </header>

      <main style={{ padding: "20px" }}>
        {view === "list" && (
          loading ? <div style={{ textAlign: "center", color: "#888" }}>Loading reviews...</div> :
          reviews.length === 0 ? (
            <div style={{ textAlign: "center", padding: "50px 20px", color: "#bbb" }}>
              <div style={{ fontSize: 40, marginBottom: 10 }}>🍜</div>
              <p>No reviews yet. Click <b>+ New Review</b> to create your first one!</p>
            </div>
          ) : reviews.map(r => (
            <div key={r.id} style={{ border: "1.5px solid #efefef", borderRadius: 12, padding: 15, marginBottom: 10 }}>
              <div style={{ fontWeight: 800 }}>{CATEGORIES.find(c => c.id === r.category)?.emoji} {r.title}</div>
              <div style={{ fontSize: 12, color: "#aaa" }}>{r.category} · {new Date(r.created_at).toLocaleDateString()}</div>
            </div>
          ))
        )}

        {view === "editor" && (
          <div>
            <label style={{ fontSize: 11, fontWeight: 800, color: "#aaa", textTransform: "uppercase" }}>Review Title</label>
            <input value={title} onChange={e => setTitle(e.target.value)} placeholder="e.g. Best Ramen in Town" style={{ width: "100%", padding: 12, marginTop: 5, marginBottom: 20, borderRadius: 8, border: "1.5px solid #eee" }} />
            
            <label style={{ fontSize: 11, fontWeight: 800, color: "#aaa", textTransform: "uppercase" }}>Category</label>
            <div style={{ display: "flex", gap: 5, flexWrap: "wrap", marginTop: 5, marginBottom: 20 }}>
              {CATEGORIES.map(c => (
                <button key={c.id} onClick={() => setCategory(c.id)} style={{ padding: "6px 12px", borderRadius: 8, border: "1.5px solid", borderColor: category === c.id ? "#f5c542" : "#eee", background: category === c.id ? "#fffbea" : "#fff", fontSize: 12, cursor: "pointer" }}>{c.emoji} {c.label}</button>
              ))}
            </div>

            <label style={{ fontSize: 11, fontWeight: 800, color: "#aaa", textTransform: "uppercase" }}>Your Honest Thoughts</label>
            <textarea value={masterReview} onChange={e => setMasterReview(e.target.value)} placeholder="Write your unfiltered thoughts..." style={{ width: "100%", height: 180, padding: 12, marginTop: 5, marginBottom: 20, borderRadius: 8, border: "1.5px solid #eee", lineHeight: 1.6 }} />
            
            <button onClick={handleGenerate} disabled={generating} style={{ width: "100%", padding: 15, background: "#0f0f0f", color: "#f5c542", border: "none", borderRadius: 12, fontWeight: 900, cursor: "pointer" }}>
              {generating ? "⚡ GENERATING..." : "⚡ GENERATE FOR ALL PLATFORMS"}
            </button>
          </div>
        )}

        {view === "result" && generatedContent && (
          <div>
            <div style={{ display: "flex", gap: 5, overflowX: "auto", paddingBottom: 10, marginBottom: 20 }}>
              {PLATFORMS.map(p => (
                <button key={p.id} onClick={() => setActivePlatform(p.id)} style={{ padding: "8px 15px", borderRadius: 20, border: "none", background: activePlatform === p.id ? p.color : "#eee", color: activePlatform === p.id ? "#fff" : "#888", fontWeight: 700, fontSize: 11, cursor: "pointer", whiteSpace: "nowrap" }}>{p.label}</button>
              ))}
            </div>
            <div style={{ border: `2px solid ${PLATFORMS.find(p => p.id === activePlatform).color}22`, borderRadius: 12, padding: 20 }}>
               <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                 <span style={{ fontWeight: 900, color: PLATFORMS.find(p => p.id === activePlatform).color }}>{activePlatform.toUpperCase()}</span>
                 <CopyBtn text={JSON.stringify(generatedContent[activePlatform])} />
               </div>
               <div style={{ fontSize: 14, lineHeight: 1.6, whiteSpace: "pre-wrap" }}>
                {typeof generatedContent[activePlatform] === 'string' ? generatedContent[activePlatform] : JSON.stringify(generatedContent[activePlatform], null, 2)}
               </div>
            </div>
          </div>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
